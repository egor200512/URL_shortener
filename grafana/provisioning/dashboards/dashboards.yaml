apiVersion: 1

providers:
  - name: URL Shortener
    orgId: 1
    folder: URL Shortener
    folderUid: url-shortener
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
