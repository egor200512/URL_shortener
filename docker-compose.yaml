version: "3.8"

services:
  url_shortener_auth:
    profiles:
      - app
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: url_shortener_auth
    restart: unless-stopped
    environment:
      GRPC_HOST: 0.0.0.0
      GRPC_AUTH_DOCKER_HOST: url_shortener_auth
      GRPC_AUTH_PORT: ${GRPC_AUTH_PORT:-8080}
      GRPC_LINKS_PORT: ${GRPC_LINKS_PORT:-8081}
      GRPC_ANALYTICS_PORT: ${GRPC_ANALYTICS_PORT:-8082}
      HTTP_HOST: 0.0.0.0
      HTTP_AUTH_PORT: ${HTTP_AUTH_PORT:-8083}
      HTTP_LINKS_PORT: ${HTTP_LINKS_PORT:-8084}
      HTTP_ANALYTICS_PORT: ${HTTP_ANALYTICS_PORT:-8085}
      PG_AUTH_DSN: host=url_shortener_auth_pg user=${PG_USER:-user} password=${PG_PASSWORD:-pass} dbname=${PG_NAME:-user} port=5432 sslmode=disable
      PG_LINKS_DSN: host=url_shortener_links_pg user=${PG_USER:-user} password=${PG_PASSWORD:-pass} dbname=${PG_NAME:-user} port=5432 sslmode=disable
      PG_ANALYTICS_DSN: host=url_shortener_analytics_pg user=${PG_USER:-user} password=${PG_PASSWORD:-pass} dbname=${PG_NAME:-user} port=5432 sslmode=disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local_secret_key}
      JWT_ACCESS_EXPIRY_MINUTES: ${JWT_ACCESS_EXPIRY_MINUTES:-60}
    ports:
      - "${HTTP_AUTH_PORT:-8083}:${HTTP_AUTH_PORT:-8083}"
      - "${GRPC_AUTH_PORT:-8080}:${GRPC_AUTH_PORT:-8080}"
    depends_on:
      url_shortener_auth_migrate:
        condition: service_completed_successfully

  url_shortener_links:
    profiles:
      - app
    build:
      context: .
      dockerfile: services/links/Dockerfile
    container_name: url_shortener_links
    restart: unless-stopped
    environment:
      GRPC_HOST: 0.0.0.0
      GRPC_AUTH_DOCKER_HOST: url_shortener_auth
      GRPC_AUTH_PORT: ${GRPC_AUTH_PORT:-8080}
      GRPC_LINKS_PORT: ${GRPC_LINKS_PORT:-8081}
      GRPC_ANALYTICS_PORT: ${GRPC_ANALYTICS_PORT:-8082}
      HTTP_HOST: 0.0.0.0
      HTTP_AUTH_PORT: ${HTTP_AUTH_PORT:-8083}
      HTTP_LINKS_PORT: ${HTTP_LINKS_PORT:-8084}
      HTTP_ANALYTICS_PORT: ${HTTP_ANALYTICS_PORT:-8085}
      PG_AUTH_DSN: host=url_shortener_auth_pg user=${PG_USER:-user} password=${PG_PASSWORD:-pass} dbname=${PG_NAME:-user} port=5432 sslmode=disable
      PG_LINKS_DSN: host=url_shortener_links_pg user=${PG_USER:-user} password=${PG_PASSWORD:-pass} dbname=${PG_NAME:-user} port=5432 sslmode=disable
      PG_ANALYTICS_DSN: host=url_shortener_analytics_pg user=${PG_USER:-user} password=${PG_PASSWORD:-pass} dbname=${PG_NAME:-user} port=5432 sslmode=disable
      REDIS_HOST: url_shortener_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-red_pass}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_TTL_MINUTES: ${REDIS_TTL_MINUTES:-600}
      KAFKA_BROKERS: url_shortener_kafka:19092
      KAFKA_CLIENT_ID: links
      KAFKA_TOPIC: ${KAFKA_TOPIC:-link_events}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-link_events.dlq}
      KAFKA_PRODUCE_TIMEOUT_SECONDS: ${KAFKA_PRODUCE_TIMEOUT_SECONDS:-10}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local_secret_key}
      JWT_ACCESS_EXPIRY_MINUTES: ${JWT_ACCESS_EXPIRY_MINUTES:-60}
    ports:
      - "${HTTP_LINKS_PORT:-8084}:${HTTP_LINKS_PORT:-8084}"
      - "${GRPC_LINKS_PORT:-8081}:${GRPC_LINKS_PORT:-8081}"
    depends_on:
      url_shortener_auth:
        condition: service_started
      url_shortener_links_migrate:
        condition: service_completed_successfully
      url_shortener_redis:
        condition: service_healthy
      url_shortener_kafka_init:
        condition: service_completed_successfully

  url_shortener_analytics:
    profiles:
      - app
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    container_name: url_shortener_analytics
    restart: unless-stopped
    environment:
      GRPC_HOST: 0.0.0.0
      GRPC_AUTH_DOCKER_HOST: url_shortener_auth
      GRPC_AUTH_PORT: ${GRPC_AUTH_PORT:-8080}
      GRPC_LINKS_PORT: ${GRPC_LINKS_PORT:-8081}
      GRPC_ANALYTICS_PORT: ${GRPC_ANALYTICS_PORT:-8082}
      HTTP_HOST: 0.0.0.0
      HTTP_AUTH_PORT: ${HTTP_AUTH_PORT:-8083}
      HTTP_LINKS_PORT: ${HTTP_LINKS_PORT:-8084}
      HTTP_ANALYTICS_PORT: ${HTTP_ANALYTICS_PORT:-8085}
      METRICS_HOST: 0.0.0.0
      METRICS_ANALYTICS_PORT: ${METRICS_ANALYTICS_PORT:-9090}
      PG_AUTH_DSN: host=url_shortener_auth_pg user=${PG_USER:-user} password=${PG_PASSWORD:-pass} dbname=${PG_NAME:-user} port=5432 sslmode=disable
      PG_LINKS_DSN: host=url_shortener_links_pg user=${PG_USER:-user} password=${PG_PASSWORD:-pass} dbname=${PG_NAME:-user} port=5432 sslmode=disable
      PG_ANALYTICS_DSN: host=url_shortener_analytics_pg user=${PG_USER:-user} password=${PG_PASSWORD:-pass} dbname=${PG_NAME:-user} port=5432 sslmode=disable
      KAFKA_BROKERS: url_shortener_kafka:19092
      KAFKA_CLIENT_ID: analytics
      KAFKA_TOPIC: ${KAFKA_TOPIC:-link_events}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-link_events.dlq}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-analytics_consumer}
      KAFKA_CONSUMER_BATCH: ${KAFKA_CONSUMER_BATCH:-100}
      KAFKA_CONSUMER_WAIT_SECONDS: ${KAFKA_CONSUMER_WAIT_SECONDS:-5}
      KAFKA_HANDLER_MAX_ATTEMPTS: ${KAFKA_HANDLER_MAX_ATTEMPTS:-5}
      KAFKA_RETRY_BACKOFF_SECONDS: ${KAFKA_RETRY_BACKOFF_SECONDS:-1}
      KAFKA_RETRY_MAX_BACKOFF_SECONDS: ${KAFKA_RETRY_MAX_BACKOFF_SECONDS:-16}
      KAFKA_PRODUCE_TIMEOUT_SECONDS: ${KAFKA_PRODUCE_TIMEOUT_SECONDS:-10}
      KAFKA_COMMIT_TIMEOUT_SECONDS: ${KAFKA_COMMIT_TIMEOUT_SECONDS:-10}
    ports:
      - "${HTTP_ANALYTICS_PORT:-8085}:${HTTP_ANALYTICS_PORT:-8085}"
      - "${GRPC_ANALYTICS_PORT:-8082}:${GRPC_ANALYTICS_PORT:-8082}"
      - "${METRICS_ANALYTICS_PORT:-9090}:${METRICS_ANALYTICS_PORT:-9090}"
    depends_on:
      url_shortener_analytics_migrate:
        condition: service_completed_successfully
      url_shortener_kafka_init:
        condition: service_completed_successfully

  url_shortener_auth_migrate:
    profiles:
      - app
    image: ubuntu:24.04
    container_name: url_shortener_auth_migrate
    working_dir: /work
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: host=url_shortener_auth_pg user=${PG_USER:-user} password=${PG_PASSWORD:-pass} dbname=${PG_NAME:-user} port=5432 sslmode=disable
    volumes:
      - ./services/auth/migrations:/migrations:ro
      - ./shared/bin/goose:/usr/local/bin/goose:ro
    command: >
      sh -c "goose -dir /migrations -table goose_version_auth up -v"
    depends_on:
      url_shortener_auth_pg:
        condition: service_healthy
    restart: "no"

  url_shortener_links_migrate:
    profiles:
      - app
    image: ubuntu:24.04
    container_name: url_shortener_links_migrate
    working_dir: /work
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: host=url_shortener_links_pg user=${PG_USER:-user} password=${PG_PASSWORD:-pass} dbname=${PG_NAME:-user} port=5432 sslmode=disable
    volumes:
      - ./services/links/migrations:/migrations:ro
      - ./shared/bin/goose:/usr/local/bin/goose:ro
    command: >
      sh -c "goose -dir /migrations -table goose_version_links up -v"
    depends_on:
      url_shortener_links_pg:
        condition: service_healthy
    restart: "no"

  url_shortener_analytics_migrate:
    profiles:
      - app
    image: ubuntu:24.04
    container_name: url_shortener_analytics_migrate
    working_dir: /work
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: host=url_shortener_analytics_pg user=${PG_USER:-user} password=${PG_PASSWORD:-pass} dbname=${PG_NAME:-user} port=5432 sslmode=disable
    volumes:
      - ./services/analytics/migrations:/migrations:ro
      - ./shared/bin/goose:/usr/local/bin/goose:ro
    command: >
      sh -c "goose -dir /migrations -table goose_version_analytics up -v"
    depends_on:
      url_shortener_analytics_pg:
        condition: service_healthy
    restart: "no"

  url_shortener_auth_pg:
    image: postgres:17-alpine
    container_name: url_shortener_auth_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_NAME:-user}
      POSTGRES_USER: ${PG_USER:-user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-pass}
    ports:
      - "${PG_AUTH_PORT:-5432}:5432"
    volumes:
      - url_shortener_auth_pg_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  url_shortener_links_pg:
    image: postgres:17-alpine
    container_name: url_shortener_links_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_NAME:-user}
      POSTGRES_USER: ${PG_USER:-user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-pass}
    ports:
      - "${PG_LINKS_PORT:-5433}:5432"
    volumes:
      - url_shortener_links_pg_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  url_shortener_analytics_pg:
    image: postgres:17-alpine
    container_name: url_shortener_analytics_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_NAME:-user}
      POSTGRES_USER: ${PG_USER:-user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-pass}
    ports:
      - "${PG_ANALYTICS_PORT:-5434}:5432"
    volumes:
      - url_shortener_analytics_pg_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  url_shortener_redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-red_pass}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-red_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_volume:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  url_shortener_kafka:
    image: apache/kafka:4.2.2
    hostname: url_shortener_kafka
    container_name: url_shortener_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092},PLAINTEXT://url_shortener_kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@url_shortener_kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    depends_on:
      url_shortener_kafka_storage_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  url_shortener_kafka_storage_init:
    image: apache/kafka:4.2.2
    container_name: url_shortener_kafka_storage_init
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    restart: "no"

  url_shortener_kafka_init:
    image: apache/kafka:4.2.2
    container_name: url_shortener_kafka_init
    depends_on:
      url_shortener_kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server url_shortener_kafka:19092 \
          --create --if-not-exists \
          --topic ${KAFKA_TOPIC:-link_events} \
          --partitions ${KAFKA_TOPIC_PARTITIONS:-3} \
          --replication-factor 1 \
          --config retention.ms=${KAFKA_RETENTION_MS:--1}
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server url_shortener_kafka:19092 \
          --create --if-not-exists \
          --topic ${KAFKA_DLQ_TOPIC:-link_events.dlq} \
          --partitions ${KAFKA_TOPIC_PARTITIONS:-3} \
          --replication-factor 1 \
          --config retention.ms=${KAFKA_RETENTION_MS:--1}
    restart: "no"

  url_shortener_prometheus:
    image: prom/prometheus:v3.8.0
    container_name: url_shortener_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  url_shortener_grafana:
    image: grafana/grafana:12.3.0
    container_name: url_shortener_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - url_shortener_prometheus

volumes:
  url_shortener_auth_pg_volume:
  url_shortener_links_pg_volume:
  url_shortener_analytics_pg_volume:
  redis_volume:
  kafka_data:
  grafana_data:
