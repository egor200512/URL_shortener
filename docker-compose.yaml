version: '3.8'

services:
  url_shortener_auth_pg:
    image: postgres:17-alpine
    container_name: url_shortener_auth_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "${PG_AUTH_PORT}:5432"
    volumes:
      - url_shortener_auth_pg_volume:/var/lib/postgresql/data
    
  url_shortener_links_pg:
    image: postgres:17-alpine
    container_name: url_shortener_links_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "${PG_LINKS_PORT}:5432"
    volumes:
      - url_shortener_links_pg_volume:/var/lib/postgresql/data

  url_shortener_analytics_pg:
    image: postgres:17-alpine
    container_name: url_shortener_analytics_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "${PG_ANALYTICS_PORT}:5432"
    volumes:
      - url_shortener_analytics_pg_volume:/var/lib/postgresql/data

  url_shortener_redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_volume:/data

  url_shortener_nats:
    image: nats:2-alpine
    container_name: url_shortener_nats
    restart: unless-stopped
    command: [
      "-p", "4222",
      "--jetstream",
      "--store_dir", "/data/js",
      "--user", "${NATS_USER}",
      "--pass", "${NATS_PASSWORD}"
    ]
    ports:
      - "${NATS_PORT}:4222"
    volumes:
      - nats_js:/data/js

  url_shortener_prometheus:
    image: prom/prometheus
    container_name: url_shortener_prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # depends_on: [analytics]


volumes:
  url_shortener_auth_pg_volume:
  url_shortener_links_pg_volume:
  url_shortener_analytics_pg_volume:
  redis_volume:
  nats_js:
