version: '3.8'

services:

# ==================================================== microservices ====================================================
  url_shortener_auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: url_shortener_auth
    environment:
      - GRPC_HOST=${GRPC_HOST}
      - GRPC_AUTH_DOCKER_HOST=${GRPC_AUTH_DOCKER_HOST}
      - GRPC_AUTH_PORT=${GRPC_AUTH_PORT}
      - HTTP_HOST=${HTTP_HOST}
      - HTTP_AUTH_PORT=${HTTP_AUTH_PORT}
      - PG_AUTH_DSN=${PG_AUTH_DSN}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_EXPIRY_MINUTES=${JWT_ACCESS_EXPIRY_MINUTES}
    ports:
      - "${HTTP_AUTH_PORT}:${HTTP_AUTH_PORT}"
      - "${GRPC_AUTH_PORT}:${GRPC_AUTH_PORT}"
    depends_on:
      - url_shortener_auth_pg
      - url_shortener_nats
      - url_shortener_redis

  url_shortener_links:
    build:
      context: .
      dockerfile: services/links/Dockerfile
    container_name: url_shortener_links
    environment:
      - GRPC_HOST=${GRPC_HOST}
      - GRPC_AUTH_DOCKER_HOST=${GRPC_AUTH_DOCKER_HOST}
      - GRPC_LINKS_PORT=${GRPC_LINKS_PORT}
      - HTTP_HOST=${HTTP_HOST}
      - HTTP_LINKS_PORT=${HTTP_LINKS_PORT}
      - PG_LINKS_DSN=${PG_LINKS_DSN}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_EXPIRY_MINUTES=${JWT_ACCESS_EXPIRY_MINUTES}
    ports:
      - "${HTTP_LINKS_PORT}:${HTTP_LINKS_PORT}"
      - "${GRPC_LINKS_PORT}:${GRPC_LINKS_PORT}"
    depends_on:
      - url_shortener_links_pg
      - url_shortener_nats
      - url_shortener_redis

  url_shortener_analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    container_name: url_shortener_analytics
    environment:
      - GRPC_HOST=${GRPC_HOST}
      - GRPC_AUTH_DOCKER_HOST=${GRPC_AUTH_DOCKER_HOST}
      - GRPC_ANALYTICS_PORT=${GRPC_ANALYTICS_PORT}
      - HTTP_HOST=${HTTP_HOST}
      - HTTP_ANALYTICS_PORT=${HTTP_ANALYTICS_PORT}
      - PG_ANALYTICS_DSN=${PG_ANALYTICS_DSN}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_EXPIRY_MINUTES=${JWT_ACCESS_EXPIRY_MINUTES}
    ports:
      - "${HTTP_ANALYTICS_PORT}:${HTTP_ANALYTICS_PORT}"
      - "${GRPC_ANALYTICS_PORT}:${GRPC_ANALYTICS_PORT}"
      - "${METRICS_ANALYTICS_PORT}:${METRICS_ANALYTICS_PORT}"
    depends_on:
      - url_shortener_analytics_pg
      - url_shortener_nats
      - url_shortener_redis

# ==================================================== pg ====================================================
  url_shortener_auth_pg:
    image: postgres:17-alpine
    container_name: url_shortener_auth_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "${PG_AUTH_PORT}:5432"
    volumes:
      - url_shortener_auth_pg_volume:/var/lib/postgresql/data
    
  url_shortener_links_pg:
    image: postgres:17-alpine
    container_name: url_shortener_links_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "${PG_LINKS_PORT}:5432"
    volumes:
      - url_shortener_links_pg_volume:/var/lib/postgresql/data

  url_shortener_analytics_pg:
    image: postgres:17-alpine
    container_name: url_shortener_analytics_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "${PG_ANALYTICS_PORT}:5432"
    volumes:
      - url_shortener_analytics_pg_volume:/var/lib/postgresql/data

# ==================================================== redis ====================================================

  url_shortener_redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_volume:/data

# ==================================================== nats ====================================================
  url_shortener_nats:
    image: nats:2-alpine
    container_name: url_shortener_nats
    restart: unless-stopped
    command: [
      "-p", "4222",
      "--jetstream",
      "--store_dir", "/data/js",
      "--user", "${NATS_USER}",
      "--pass", "${NATS_PASSWORD}"
    ]
    ports:
      - "${NATS_PORT}:4222"
    volumes:
      - nats_js:/data/js 

# ==================================================== monitoring ====================================================

  url_shortener_prometheus:
    image: prom/prometheus
    container_name: url_shortener_prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  url_shortener_grafana:
    image: grafana/grafana:10.4.3
    container_name: url_shortener_grafana
    depends_on:
      - url_shortener_prometheus
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "user"
      GF_SECURITY_ADMIN_PASSWORD: "pass"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana_user/datasources:/etc/grafana/provisioning/datasources
      - ./deploy/grafana_user/dashboards:/etc/grafana/provisioning/dashboards

  url_shortener_analytics_pg_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter
    container_name: url_shortener_analytics_pg_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${PG_USER}:${PG_PASSWORD}@url_shortener_analytics_pg:5432/${PG_NAME}?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./deploy/postgres_exporter_user_rw/queries_analytics.yaml:/etc/postgres_exporter/queries.yaml
    depends_on:
      - url_shortener_analytics_pg

# ==================================================== volumes ====================================================

volumes:
  url_shortener_auth_pg_volume:
  url_shortener_links_pg_volume:
  url_shortener_analytics_pg_volume:
  redis_volume:
  nats_js:
  grafana_data:
