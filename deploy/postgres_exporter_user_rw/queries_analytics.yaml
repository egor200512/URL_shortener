events_per_second:
  query: |
    WITH types AS (
      -- фиксированный перечень известных типов событий
      SELECT unnest(ARRAY['created','fetched','deleted']) AS event_type
    ), counts AS (
      SELECT event_type, COUNT(*) AS cnt
      FROM analytics.link_events
      WHERE executed_at >= NOW() - INTERVAL '30 seconds'
      GROUP BY event_type
    )
    SELECT t.event_type, COALESCE(c.cnt, 0)::float / 30.0 AS events_per_second
    FROM types t
    LEFT JOIN counts c USING (event_type);
  metrics:
    - event_type:
        usage: LABEL
        description: "Event type"
    - events_per_second:
        usage: GAUGE
        description: "Link events per second (avg over last 30s)"
